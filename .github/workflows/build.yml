name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" -type f | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          WORK_DIR="$RUNNER_TEMP/android_src"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting archive: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d "$WORK_DIR"
          else
            cp -R . "$WORK_DIR"
          fi

          PROJECT_DIR=$(find "$WORK_DIR" -maxdepth 5 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1 | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle.kts or settings.gradle after extracting."
            find "$WORK_DIR" -maxdepth 4
            exit 1
          fi

          cd "$PROJECT_DIR"
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          ./gradlew assembleDebug --stacktrace

          APK_FOUND=$(find "$PROJECT_DIR/app/build/outputs/apk" -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "APK file was not generated."
            exit 1
          fi
          cp "$APK_FOUND" "$RUNNER_TEMP/app-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ runner.temp }}/app-debug.apk
